[project]
name = "openclicky-linux"
version = "0.1.0"
description = "OpenClicky dictation for Linux (X11): hold a key, speak, let go."
requires-python = ">=3.10"
license = "MIT"
# PyGObject (GTK 3) comes from the distribution: python3-gi and gir1.2-gtk-3.0.
dependencies = ["python-xlib>=0.33"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
openclicky-linux = "openclicky_linux.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["openclicky_linux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["x11: needs Xvfb (a private X server is started for the test; the real desktop is never touched)"]
